services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: gymtracker
      POSTGRES_PASSWORD: gymtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - gym-net

  gym-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: mukesh20120/gym-tracker-server:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gymtracker:gymtracker@db:5432/gymtracker
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-net

  gym-web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: mukesh20120/gym-tracker-web:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gym-server
    restart: unless-stopped
    networks:
      - gym-net

networks:
  gym-net:

volumes:
  pgdata:
