# ─────────────────────────────────────────────────
# LOCAL TESTING (Step 2.5):
#   Comment out the "return 301" line in the HTTP block
#   and comment out the entire HTTPS server block below.
#   Then http://localhost:8080 will serve the app directly.
#
# PRODUCTION (Oracle VM):
#   Keep both blocks as-is. HTTP redirects to HTTPS.
# ─────────────────────────────────────────────────

server {
    listen 80;
    server_name gym.voicelogger.online;

    # Comment out the line below for local testing
    return 301 https://$host$request_uri;

    # Uncomment the block below (and comment out "return 301") for local testing only
    # root /usr/share/nginx/html;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # location /api {
    #     proxy_pass http://gym-server:4000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# ─────────────────────────────────────────────────
# Comment out this entire block for local testing
# ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name gym.voicelogger.online;

    ssl_certificate     /etc/letsencrypt/live/gym.voicelogger.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.voicelogger.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://gym-server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
